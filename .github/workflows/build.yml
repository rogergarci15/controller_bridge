name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: pip install ".[dev]" pyinstaller
      - name: Tests
        run: pytest -q
      - name: Construir ejecutable
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ZwiftRideBridge
          --add-data "zwiftplay/default_config.yaml;zwiftplay"
          --collect-submodules winrt --collect-submodules bleak
          --exclude-module pynput
          packaging/app_entry.py
      - name: Comprobar el ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ZwiftRideBridge.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path selftest-error.txt) { Get-Content selftest-error.txt }
            throw "selftest del ejecutable: código $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ZwiftRideBridge-windows
          path: dist/ZwiftRideBridge.exe
      # Cada cambio en main publica una versión nueva con el ejecutable.
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Zwift Ride Bridge v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: dist/ZwiftRideBridge.exe
          generate_release_notes: true

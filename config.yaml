# Mapeo Zwift Ride -> MyWhoosh (teclado).
#
# Controles disponibles (lado.botón):
#   left.up  left.down  left.left  left.right        cruceta del mando izquierdo
#   right.a  right.b  right.y  right.z               botones del mando derecho
#   left.shift_upper   left.shift_lower              botones de cambio izquierdos
#   right.shift_upper  right.shift_lower             botones de cambio derechos
#   left.powerup  right.powerup                      botones de power-up
#   left.power    right.power                        botones de encendido
#   left.paddle   right.paddle                       palancas naranjas (analógicas, 0-100)
#
# Forma corta:   control: tecla
# Forma larga:   control: {key: tecla, mode: tap|hold|repeat, ...}
#   mode: tap     un toque de tecla por pulsación (por defecto en botones)
#   mode: hold    tecla pulsada mientras dure (por defecto en palancas)
#   mode: repeat  toque, y si se mantiene repite (repeat_delay, repeat_interval en segundos)
#   long_key + long_after   pulsación larga: otra tecla si se mantiene `long_after` s
#   threshold / release     palancas: se activa al llegar a threshold, se suelta por debajo de release
# Ratón, en vez de tecla:   control: {mouse: up|down|left|right|click|right_click}
#   up/down/left/right mueven el puntero mientras se mantiene (acelera poco a poco);
#   click/right_click son los botones del ratón.
# Teclas: un carácter (i, k, a, 1...) o: left right up down space enter esc tab f1..f12 ...
# Un control que no aparece (o con valor vacío) no hace nada.

mapping:
  # Cambio de marchas. Comprobado en MyWhoosh: K = subir marcha, I = bajar.
  right.shift_upper: k
  right.shift_lower: k
  left.shift_upper: i
  left.shift_lower: i

  # Dirección: tecla mantenida mientras la palanca pase del umbral.
  left.paddle:  {key: a, mode: hold, threshold: 50, release: 30}
  right.paddle: {key: d, mode: hold, threshold: 50, release: 30}

  # Ratón con la cruceta, como un joystick: mover con las flechas, clic con A.
  # Sirve para todo lo que MyWhoosh no tiene en el teclado (intensidad del
  # entrenamiento, menú...): lleva el puntero al botón y pulsa A.
  left.up:    {mouse: up}
  left.down:  {mouse: down}
  left.left:  {mouse: left}
  left.right: {mouse: right}
  right.a:    {mouse: click}

  # Comprobado en MyWhoosh con el teclado:
  right.b: enter         # pausa; también repite el último botón pulsado con el ratón
  right.z: u             # mostrar / ocultar la interfaz

# Velocidad del puntero, en píxeles por segundo: empieza en start_speed y
# llega a max_speed tras accel_time segundos con la flecha mantenida.
mouse:
  start_speed: 120
  max_speed: 1400
  accel_time: 1.0

# Aviso de batería baja (%). Se usará en la fase 4.
low_battery: 15
